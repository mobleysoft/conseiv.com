name = "conseiv-studio-canary"
main = "worker/index.js"
compatibility_date = "2026-08-27"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "conseiv-studio"
# Local-only until a real, reviewed D1 database is provisioned for this app.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
AUTHFOR_ORIGIN = "https://authfor.com"
