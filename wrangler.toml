name = "conseiv-studio-canary"
main = "worker/index.js"
compatibility_date = "2026-08-27"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "conseiv-studio"
# Provisioned 2026-09-14 (depth audit) via `wrangler d1 create conseiv-studio`
# in the real johnmobley99 Cloudflare account. Not yet in production traffic -
# see workers_dev below, used only for staging live-verification.
database_id = "d8e89723-2dd8-4233-9f72-1889cdb76466"
migrations_dir = "migrations"

[vars]
AUTHFOR_ORIGIN = "https://authfor.com"
